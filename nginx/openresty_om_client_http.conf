# 1Panel/OpenResty HTTP entry point for the mobile client.
#
# Copy this file to the OpenResty conf.d directory as 00.default.conf and copy
# om_client_api.conf beside it as om_client_api.inc. The API service remains
# bound to 127.0.0.1:8088; only this reverse proxy is internet-facing.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 124.222.212.233 _;

    include /usr/local/openresty/nginx/conf/conf.d/om_client_api.inc;

    location / {
        return 404;
    }
}
