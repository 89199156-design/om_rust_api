# Shanghai OM client API. Include these locations under the existing server {}.
#
# Point clients call /v1/* directly. The Rust service reads local OM range
# bundles internally, so clients do not fetch latest.json or manifests.
# Map layers read rendered WebP products through /data/webp/.

# These links make the exact deployed source offer and data-source description
# discoverable from API and generated-product responses.
# The detailed data notice remains authoritative for provider-specific terms.

location = /.well-known/weather-attribution.json {
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0;
        return 204;
    }

    proxy_pass http://127.0.0.1:8088;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Expose-Headers "Link" always;
    add_header Cache-Control "public, max-age=300" always;
    add_header Link '</v1/source>; rel="source", <https://www.gnu.org/licenses/agpl-3.0.html>; rel="license", </.well-known/weather-attribution.json>; rel="describedby"' always;
}

location ~ "^/source/(?<source_archive>om_weather_server-[0-9a-f]{40}\.tar\.gz(?:\.sha256)?)$" {
    alias /opt/1panel/apps/weather_om_api/source-archives/$source_archive;
    autoindex off;
    limit_except GET { deny all; }
    default_type application/octet-stream;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Expose-Headers "Link" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Link '</v1/source>; rel="source", <https://www.gnu.org/licenses/agpl-3.0.html>; rel="license", </.well-known/weather-attribution.json>; rel="describedby"' always;
}

location /v1/ {
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Access-Control-Max-Age 86400 always;
        add_header Content-Length 0;
        return 204;
    }

    proxy_pass http://127.0.0.1:8088;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Expose-Headers "Link" always;
    add_header Cache-Control "no-store" always;
    add_header Link '</v1/source>; rel="source", <https://www.gnu.org/licenses/agpl-3.0.html>; rel="license", </.well-known/weather-attribution.json>; rel="describedby"' always;
}

location ~ ^/data/om/(gfs013_surface|gfs025|gfs_pressure_profile|cams_global|ecmwf_ifs025)/coverages/(.+\.json)$ {
    alias /data/om_raw/$1/coverages/$2;
    autoindex off;
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Expose-Headers "Link" always;
    add_header Cache-Control "public, max-age=300" always;
    add_header Link '</v1/source>; rel="source", <https://www.gnu.org/licenses/agpl-3.0.html>; rel="license", </.well-known/weather-attribution.json>; rel="describedby"' always;
}

location ~ ^/data/om/(gfs013_surface|gfs025|gfs_pressure_profile|cams_global|ecmwf_ifs025)/coverages/(.+\.omranges)$ {
    alias /data/om_raw/$1/coverages/$2;
    autoindex off;
    default_type application/octet-stream;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Expose-Headers "Link" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Link '</v1/source>; rel="source", <https://www.gnu.org/licenses/agpl-3.0.html>; rel="license", </.well-known/weather-attribution.json>; rel="describedby"' always;
}

location ~ ^/data/webp/(gfs013_surface|cams_global|ecmwf_ifs025|gfs_derived|gfs_data|cams_data)/(.+\.json)$ {
    alias /opt/1panel/apps/weather/data/$1/$2;
    autoindex off;
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Expose-Headers "Link" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Link '</v1/source>; rel="source", <https://www.gnu.org/licenses/agpl-3.0.html>; rel="license", </.well-known/weather-attribution.json>; rel="describedby"' always;
}

location ~ ^/data/webp/(gfs013_surface|cams_global|ecmwf_ifs025|gfs_derived|gfs_data|cams_data)/(.+\.webp)$ {
    alias /opt/1panel/apps/weather/data/$1/$2;
    autoindex off;
    default_type image/webp;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Expose-Headers "Link" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Link '</v1/source>; rel="source", <https://www.gnu.org/licenses/agpl-3.0.html>; rel="license", </.well-known/weather-attribution.json>; rel="describedby"' always;
}

location ~ ^/data/webp/(point_package|pressure_profile_package)/(.+\.bin)$ {
    alias /opt/1panel/apps/weather/data/$1/$2;
    autoindex off;
    default_type application/octet-stream;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Expose-Headers "Link" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Link '</v1/source>; rel="source", <https://www.gnu.org/licenses/agpl-3.0.html>; rel="license", </.well-known/weather-attribution.json>; rel="describedby"' always;
}
