# Shanghai OM client API. Include these locations under the existing server {}.
#
# Point clients read fixed or explicitly assigned OM range bundle URLs through /data/om/.
# Map layers read rendered WebP products through /data/webp/.

location ~ ^/data/om/(gfs013_surface|gfs025|gfs_pressure_profile|cams_global)/coverages/(.+\.json)$ {
    alias /data/om_raw/$1/coverages/$2;
    autoindex off;
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=300" always;
}

location ~ ^/data/om/(gfs013_surface|gfs025|gfs_pressure_profile|cams_global)/coverages/(.+\.omranges)$ {
    alias /data/om_raw/$1/coverages/$2;
    autoindex off;
    default_type application/octet-stream;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ~ ^/data/webp/(gfs013_surface|cams_global|gfs_derived|gfs_data|cams_data)/(.+\.json)$ {
    alias /opt/1panel/apps/weather/data/$1/$2;
    autoindex off;
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}

location ~ ^/data/webp/(gfs013_surface|cams_global|gfs_derived|gfs_data|cams_data)/(.+\.webp)$ {
    alias /opt/1panel/apps/weather/data/$1/$2;
    autoindex off;
    default_type image/webp;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location ~ ^/data/webp/(point_package|pressure_profile_package)/(.+\.bin)$ {
    alias /opt/1panel/apps/weather/data/$1/$2;
    autoindex off;
    default_type application/octet-stream;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
