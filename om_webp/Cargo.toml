[package]
name = "om-webp"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["webp"] }
om-api = { git = "https://github.com/89199156-design/om_weather_server.git", rev = "123369e521ee3f5bfe518ac1826fe5c3129f7706" }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.15"
